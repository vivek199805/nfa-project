version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: node_backend_dev
    ports:
      - "5000:5000"
    env_file:
      - .env.dev
    volumes:
      - .:/app
      - /app/node_modules
    command: nodemon server.js

    version: "3.9"

