name: Monorepo CI

on:
  push:
    branches:
      - vivek
  pull_request:
    branches:
      - staging
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  SOURCE_BRANCH: vivek
  TARGET_BRANCH: staging
  PR_REVIEWERS: vivek199805

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect backend/frontend changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'bancked/**'
            frontend:
              - 'nfa-project-frontend/**'

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: bancked

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bancked/package-lock.json

      - run: npm ci
      - run: npm test --if-present
      - run: npm run build --if-present

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: nfa-project-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nfa-project-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  create-pr:
    name: Create PR vivek to staging
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend
      - frontend

    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/vivek' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Check existing PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr list \
            --head "$SOURCE_BRANCH" \
            --base "$TARGET_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url')

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check_pr.outputs.pr_url == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --title "Auto PR: $SOURCE_BRANCH to $TARGET_BRANCH" \
            --body "Auto-created after changed project checks passed." \
            --reviewer "$PR_REVIEWERS"

      - name: Existing PR found
        if: steps.check_pr.outputs.pr_url != ''
        run: |
          echo "PR already exists: ${{ steps.check_pr.outputs.pr_url }}"