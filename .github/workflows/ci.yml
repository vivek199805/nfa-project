name: Monorepo CI

on:
  push:
    branches:
      - vivek
  pull_request:
    branches:
      - staging

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bancked

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bancked/package-lock.json

      - name: Install backend deps
        run: npm ci

      # - name: Lint backend
        # run: npm run lint --if-present

      - name: Test backend
        run: npm test --if-present

      - name: Build backend
        run: npm run build --if-present

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfa-project-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nfa-project-frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Test frontend
        run: npm test --if-present

      - name: Build frontend
        run: npm run build --if-present