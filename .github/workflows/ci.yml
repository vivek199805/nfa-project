name: Monorepo CI

on:
  push:
    branches:
      - vivek
  pull_request:
    branches:
      - staging

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bancked

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bancked/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Test backend
        run: npm test --if-present

      - name: Build backend
        run: npm run build --if-present

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfa-project-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nfa-project-frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Test frontend
        run: npm test --if-present

      - name: Build frontend
        run: npm run build --if-present

  create-pr:
    name: Create PR vivek to staging
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/vivek'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check existing PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr list \
            --head vivek \
            --base staging \
            --state open \
            --json url \
            --jq '.[0].url')

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_pr.outputs.pr_url == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base staging \
            --head vivek \
            --title "Auto PR: vivek to staging" \
            --body "Auto-created after backend and frontend checks passed." \
            --reviewer vivek199805

      - name: Existing PR found
        if: steps.check_pr.outputs.pr_url != ''
        run: |
          echo "PR already exists: ${{ steps.check_pr.outputs.pr_url }}"